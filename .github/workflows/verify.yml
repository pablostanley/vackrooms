name: Verify
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Install CPU renderer for WGSL validation
        run: npx --no-install vgpu install-software-renderer
      - run: npm run check:shaders
      - run: npm run build
